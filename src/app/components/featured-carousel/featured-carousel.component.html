<div class="carousel" *ngIf="slides.length">
  <div class="carousel-viewport">
    <article
      *ngFor="let slide of slides; let i = index"
      [class]="getPositionClass(i)"
      (click)="onSlideClick(i)"
    >
      <div class="slide-inner">
        <app-spotify-embed
          [kind]="slide.kind"
          [spotifyId]="slide.spotifyId"
          [height]="embedHeight()"
          [title]="slide.title"
        ></app-spotify-embed>
      </div>
    </article>
  </div>

  <div class="carousel-controls" *ngIf="slides.length > 1">
    <button type="button" class="carousel-btn carousel-btn--prev" (click)="prev()" aria-label="Previous slide">←</button>
    <button type="button" class="carousel-btn carousel-btn--next" (click)="next()" aria-label="Next slide">→</button>
  </div>
</div>
